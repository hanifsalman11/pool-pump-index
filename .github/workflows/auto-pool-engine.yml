name: Autonomous Pool Pump GPM & Salt Sizing Engine

on:
  schedule:
    - cron: '50 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_pool:
        description: 'Optional Pool Pump or Size (e.g. Pentair IntelliFlo3 3.0 HP)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-pool-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pool Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_POOL: ${{ github.event.inputs.custom_pool || '' }}
        run: |
          python engine/pool_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_pools.json
          if git diff --staged --quiet; then
            echo "No new pool calculator pages to commit."
          else
            git commit -m "chore(pool): auto-publish new pool pump GPM & salt calculators"
            git push origin main
          fi
